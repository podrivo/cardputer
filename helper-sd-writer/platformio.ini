; Shared SD writer helper for the Cardputer installer.
; Flashed temporarily, receives a file over USB serial, writes it to the microSD,
; then gets overwritten by the real app firmware.

[env:m5stack-stamps3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  m5stack/M5Cardputer@^1.1.1
  m5stack/M5Unified@^0.2.10
