<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardputer Installer</title>
<style>
  :root {
    --bg: #14121a;
    --card: #1e1b27;
    --line: #2e2a3b;
    --text: #ece9f5;
    --muted: #9a94ad;
    --accent: #ff7ac6;
    --ok: #6ee7a8;
    --warn: #ffc56e;
    --bad: #ff6e6e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .notice {
    border: 1px solid var(--warn);
    color: var(--warn);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 20px;
    display: none;
  }
  .notice code { color: var(--text); }
  #catalog { display: grid; gap: 28px; }
  .section { font-size: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .filters {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding: 14px 0 16px;
    margin: 0 0 8px;
    border-bottom: 1px solid var(--line);
  }
  #search {
    width: 100%;
    padding: 11px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font: inherit;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { outline: none; border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 99px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.12s ease, background 0.12s ease, border-color 0.12s ease;
  }
  .chip:hover { color: var(--text); }
  .chip.active { color: #1a0f17; background: var(--accent); border-color: var(--accent); }
  .hidden { display: none !important; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }
  .pets { display: grid; gap: 12px; }
  .pet {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .emoji { font-size: 34px; width: 44px; text-align: center; flex-shrink: 0; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 17px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .name a { color: inherit; text-decoration: none; }
  .name a:hover .label { text-decoration: underline; text-underline-offset: 3px; }
  .name .arrow { color: var(--muted); font-size: 13px; font-weight: 400; }
  .desc { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .tag {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 99px;
    border: 1px solid currentColor;
  }
  .tag.ok { color: var(--ok); }
  .tag.warn { color: var(--warn); }
  .tag.current { color: var(--accent); }
  button {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
    background: var(--accent);
    color: #1a0f17;
    transition: transform 0.1s ease, opacity 0.15s ease;
    flex-shrink: 0;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  dialog {
    width: min(560px, calc(100vw - 32px));
    padding: 22px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
  }
  dialog[open] { animation: dialog-in 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); }
  dialog::backdrop { background: rgba(8, 6, 12, 0.7); backdrop-filter: blur(3px); }
  @keyframes dialog-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
  .dlg-head { display: flex; align-items: center; gap: 14px; }
  .dlg-head .emoji { font-size: 30px; width: 38px; }
  .dlg-title { font-weight: 600; font-size: 17px; }
  .status-text { color: var(--muted); font-size: 13.5px; }
  .status-text.bad { color: var(--bad); }
  .pct { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 16px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width 0.2s ease; }
  .bar.ok > div { background: var(--ok); }
  .bar.bad > div { background: var(--bad); }
  .terminal {
    margin: 14px 0 0;
    height: 240px;
    overflow: auto;
    background: #0b0a0f;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #c9c4d8;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .terminal .step { color: var(--accent); }
  .terminal .ok { color: var(--ok); }
  .terminal .bad { color: var(--bad); }
  .terminal.collapsed { display: none; }
  .done { text-align: center; padding: 18px 0 4px; }
  .done[hidden] { display: none; }
  .check {
    width: 56px;
    height: 56px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--ok) 16%, transparent);
    color: var(--ok);
    display: grid;
    place-items: center;
    font-size: 28px;
    animation: pop 0.35s cubic-bezier(0.3, 1.5, 0.6, 1);
  }
  @keyframes pop { from { transform: scale(0.5); opacity: 0; } }
  .done-title { font-size: 19px; font-weight: 600; }
  .done-text { color: var(--muted); margin-top: 4px; font-size: 14px; }
  .dlg-actions { display: flex; gap: 10px; align-items: center; margin-top: 18px; }
  .dlg-actions[hidden] { display: none; }
  #closeBtn { margin-left: auto; }
  .link-btn { background: none; color: var(--muted); padding: 0; font-weight: 400; font-size: 13px; }
  .link-btn:hover { color: var(--text); }
  .footer {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: grid;
    gap: 14px;
  }
  .footer a { color: var(--text); text-underline-offset: 3px; }
  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
<main>
  <h1>Cardputer Installer</h1>
  <p class="sub">Plug in the Cardputer over USB-C, then click Install. Use Chrome or Edge.</p>

  <div class="notice" id="notice"></div>

  <div class="filters">
    <input type="search" id="search" placeholder="Search installers…" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>

  <div id="catalog"></div>
  <p class="empty" id="empty" hidden>No installers match.</p>

  <div class="footer">
    <div class="footer-row">
      <span>Restore the firmware the Cardputer came with (M5Stack's official User Demo v0.3). Erases the whole device first.</span>
      <button class="ghost" id="restoreBtn">Restore original</button>
    </div>
  </div>
</main>

<dialog id="dialog">
  <div id="progressView">
    <div class="dlg-head">
      <div class="emoji" id="dlgEmoji"></div>
      <div>
        <div class="dlg-title" id="dlgTitle"></div>
        <div class="status-text" id="statusText"></div>
      </div>
      <div class="pct" id="pct"></div>
    </div>
    <div class="bar" id="bar"><div id="barFill"></div></div>
  </div>
  <div class="done" id="doneView" hidden>
    <div class="check">✓</div>
    <div class="done-title" id="doneTitle"></div>
    <div class="done-text" id="doneText">Your Cardputer is restarting. Have fun!</div>
  </div>
  <pre class="terminal" id="log"></pre>
  <div class="dlg-actions" id="actions" hidden>
    <button class="link-btn" id="logsBtn">Show logs</button>
    <button class="ghost" id="copyBtn">Copy for AI</button>
    <button id="closeBtn">Done</button>
  </div>
</dialog>

<input type="file" id="filePicker" accept=".bin" hidden>

  el.className = "pet";
  el.innerHTML = `
    <div class="emoji">${item.emoji}</div>
    <div class="info">
      <div class="name"><a href="${item.repo}" target="_blank" rel="noopener"><span class="label">${item.name}</span> <span class="arrow">↗</span></a>
        <span class="tag ${item.tag[0]}">${item.tag[1]}</span>
        ${current === item.id ? '<span class="tag current">Installed</span>' : ""}
      </div>
      <div class="desc">${item.desc}</div>
    </div>`;
  el.dataset.search = `${item.name} ${item.desc} ${item.tag[1]}`.toLowerCase();
  const btn = document.createElement("button");
  btn.textContent = "Install";
  btn.onclick = () => install(item);
  el.appendChild(btn);
  buttons.push(btn);
  return el;
}

function renderChips() {
  const chips = $("chips");
  chips.innerHTML = "";
  const cats = ["all", ...BLOCKS.filter((b) => b.items).map((b) => b.title)];
  for (const cat of cats) {
    const c = document.createElement("button");
    c.className = "chip" + (cat === activeCat ? " active" : "");
    c.textContent = cat === "all" ? "All" : cat;
    c.onclick = () => { activeCat = cat; renderChips(); applyFilters(); };
    chips.appendChild(c);
  }
}

function applyFilters() {
  const q = query.trim().toLowerCase();
  const sections = [...$("catalog").children];
  let anyVisible = false;
  for (const section of sections) {
    const grid = section.querySelector(".pets");
    if (!grid) continue;
    const title = section.dataset.title;
    let shown = 0;
    for (const card of grid.children) {
      const vis = (activeCat === "all" || activeCat === title) && (!q || card.dataset.search.includes(q));
      card.classList.toggle("hidden", !vis);
      if (vis) shown++;
    }
    section.classList.toggle("hidden", shown === 0);
    if (shown) anyVisible = true;
  }
  $("empty").hidden = anyVisible;
}

function render() {
  const current = localStorage.getItem("installed");
  const catalog = $("catalog");
  catalog.innerHTML = "";
  buttons.length = 0;
  for (const block of BLOCKS) {
    const section = document.createElement("section");
    section.dataset.title = block.title;
    const h = document.createElement("h2");
    h.className = "section";
    h.textContent = block.title;
    section.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "pets";
    for (const item of block.items) grid.appendChild(cardEl(item, current));
    section.appendChild(grid);
    catalog.appendChild(section);
  }
  buttons.push($("restoreBtn"));
  renderChips();
  applyFilters();
  setBusy(busy);
}

$("search").addEventListener("input", (e) => { query = e.target.value; applyFilters(); });

function setBusy(value) {
  busy = value;
  for (const b of buttons) b.disabled = value || !("serial" in navigator);
}

function setStatus(text, kind = "") {
  $("statusText").textContent = text;
  $("statusText").className = "status-text " + kind;
}

function setProgress(fraction) {
  const pct = `${Math.round(fraction * 100)}%`;
  $("barFill").style.width = pct;
  $("pct").textContent = pct;
}

function write(text, kind = "") {
  const el = $("log");
  const stick = el.scrollHeight - el.scrollTop - el.clientHeight < 24;
  const span = document.createElement("span");
  if (kind) span.className = kind;
  span.textContent = text;
  el.appendChild(span);
  if (stick) el.scrollTop = el.scrollHeight;
}

const log = (line, kind) => write(line + "\n", kind);
const step = (line) => log(`› ${line}`, "step");
const hex = (n) => "0x" + n.toString(16).padStart(5, "0");

const terminal = {
  clean() {},
  writeLine: (s) => log(s),
  write: (s) => write(s),
};

function openDialog({ emoji, title, doneTitle, doneText }) {
  $("dlgEmoji").textContent = emoji || "↺";
  $("dlgTitle").textContent = title;
  $("doneTitle").textContent = doneTitle;
  $("doneText").textContent = doneText;
  $("log").textContent = "";
  $("log").classList.remove("collapsed");
  $("progressView").hidden = false;
  $("doneView").hidden = true;
  $("actions").hidden = true;
  $("bar").className = "bar";
  setProgress(0);
  $("dialog").showModal();
}

function finishDialog(ok) {
  $("bar").classList.add(ok ? "ok" : "bad");
  $("progressView").hidden = ok;
  $("doneView").hidden = !ok;
  $("log").classList.toggle("collapsed", ok);
  $("logsBtn").hidden = !ok;
  $("logsBtn").textContent = "Show logs";
  $("copyBtn").hidden = ok;
  $("copyBtn").textContent = "Copy for AI";
  $("closeBtn").textContent = ok ? "Done" : "Close";
  $("actions").hidden = false;
  $("closeBtn").focus();
}

$("logsBtn").onclick = () => {
  const collapsed = $("log").classList.toggle("collapsed");
  $("logsBtn").textContent = collapsed ? "Show logs" : "Hide logs";
};
$("closeBtn").onclick = () => $("dialog").close();

let failure = null;

function aiPrompt({ target, message }) {
  const files = target.parts.map((p) => `${p.file} at ${hex(p.address)}`).join(", ");
  return [
    "I'm flashing firmware onto an M5Stack Cardputer ADV (ESP32-S3, 8 MB flash, native USB-Serial/JTAG) " +
      "from a web page that uses esptool-js 0.7.0 over Web Serial, and the install failed. " +
      "Explain what went wrong and give me the steps to fix it.",
    "",
    `Firmware: ${target.name} (${files})`,
    `Browser: ${navigator.userAgent}`,
    `Error: ${message}`,
    "",
    "Full log:",
    "```",
    $("log").textContent.trim(),
    "```",
  ].join("\n");
}

$("copyBtn").onclick = async () => {
  const text = aiPrompt(failure);
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const area = Object.assign(document.createElement("textarea"), { value: text });
    $("dialog").appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  $("copyBtn").textContent = "Copied ✓";
  setTimeout(() => { $("copyBtn").textContent = "Copy for AI"; }, 2000);
};
$("dialog").addEventListener("cancel", (e) => { if (busy) e.preventDefault(); });

// file:// pages can't fetch neighbouring files, so fall back to asking for the file.
function pickFile(name) {
  return new Promise((resolve, reject) => {
    const picker = $("filePicker");
    picker.value = "";
    picker.onchange = async () => {
      const f = picker.files[0];
      if (!f) return reject(new Error("No file chosen"));
      resolve(new Uint8Array(await f.arrayBuffer()));
    };
    picker.oncancel = () => reject(new Error(`Cancelled. Please choose ${name}`));
    setStatus(`Choose ${name} from the cardputer folder`);
    picker.click();
  });
}

const fileCache = new Map();
async function loadFile(name) {
  if (fileCache.has(name)) return fileCache.get(name);
  let data;
  try {
    const res = await fetch(name);
    if (!res.ok) throw new Error(res.statusText);
    data = new Uint8Array(await res.arrayBuffer());
  } catch {
    data = await pickFile(name);
  }
  fileCache.set(name, data);
  return data;
}

async function install(target) {
  if (busy) return;
  if (target === RESTORE && !confirm("Erase the Cardputer and restore the original firmware? Saved pets and settings will be lost.")) return;

  setBusy(true);
  openDialog({
    emoji: target.emoji,
    title: `Installing ${target.name}`,
    doneTitle: `${target.name} is installed`,
    doneText: "Your Cardputer is restarting. Have fun!",
  });
  let transport;

  try {
    setStatus("Pick the Cardputer in the popup…");
    step("Waiting for a USB device");
    const port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x303a }] });
    const { usbVendorId, usbProductId } = port.getInfo();
    log(`Selected USB device ${usbVendorId?.toString(16)}:${usbProductId?.toString(16)}`);

    setStatus("Loading firmware…");
    step("Loading firmware files");
    const fileArray = [];
    for (const part of target.parts) {
      const data = await loadFile(part.file);
      fileArray.push({ data, address: part.address });
      log(`${part.file}: ${data.length.toLocaleString()} bytes at ${hex(part.address)}`);
    }
    const total = fileArray.reduce((n, f) => n + f.data.length, 0);
    const before = fileArray.map((_, i) => fileArray.slice(0, i).reduce((n, f) => n + f.data.length, 0));

    setStatus("Connecting…");
    step("Connecting to the Cardputer");
    transport = new Transport(port, false);
    const loader = new ESPLoader({ transport, baudrate: 921600, terminal, debugLogging: false });
    const chip = await loader.main();
    log(`Connected to ${chip}`, "ok");

    setStatus(`Writing ${(total / 1024 / 1024).toFixed(1)} MB to flash…`);
    step("Writing firmware");
    await loader.writeFlash({
      fileArray,
      flashMode: "keep",
      flashFreq: "keep",
      flashSize: "keep",
      eraseAll: !!target.eraseAll,
      compress: true,
      reportProgress: (i, written, size) => {
        const done = before[i] + (written / size) * fileArray[i].data.length;
        setProgress(done / total);
      },
    });

    setStatus("Restarting the Cardputer…");
    step("Restarting");
    await loader.after("hard_reset");
    setProgress(1);
    log(`Done. ${target.name} is installed.`, "ok");
    localStorage.setItem("installed", target.id);
    finishDialog(true);
  } catch (err) {
    if (!$("log").textContent.endsWith("\n")) write("\n");
    log(String(err?.stack || err), "bad");
    $("dlgTitle").textContent = `Couldn't install ${target.name}`;
    let msg = err?.name === "NotFoundError" ? "No device picked." : String(err?.message || err);
    if (/busy|open/i.test(msg)) {
      msg = "The USB port is busy. Close other tabs or apps using the Cardputer (like M5Burner or a terminal running esptool) and try again.";
    }
    setStatus(`Install failed: ${msg}`, "bad");
    failure = { target, message: `${err?.name || "Error"}: ${err?.message || err}` };
    finishDialog(false);
  } finally {
    try { await transport?.disconnect(); } catch {}
    setBusy(false);
    render();
  }
}

$("restoreBtn").onclick = () => install(RESTORE);
render();
</script>
</body>
</html>
