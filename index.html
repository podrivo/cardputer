<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardputer Installers</title>
<style>
  :root {
    --bg: #14121a;
    --card: #1e1b27;
    --line: #2e2a3b;
    --text: #ece9f5;
    --muted: #9a94ad;
    --accent: #ff7ac6;
    --ok: #6ee7a8;
    --warn: #ffc56e;
    --bad: #ff6e6e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  main { width: 100%; max-width: 1040px; }
  h1 { font-size: 32px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .notice {
    border: 1px solid var(--warn);
    color: var(--warn);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 20px;
    display: none;
  }
  .notice code { color: var(--text); }
  #catalog { display: grid; gap: 28px; }
  .section { font-size: 16px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .nav {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--bg);
    padding: 14px 0 16px;
    margin: 0 0 8px;
    border-bottom: 1px solid transparent;
  }
  .nav.stuck { border-bottom-color: var(--line); }
  .chips { display: flex; flex-wrap: nowrap; gap: 6px; flex: 1; min-width: 0; }
  .search {
    position: relative;
    flex: 0 0 180px;
    width: 180px;
  }
  .search svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--muted);
    pointer-events: none;
  }
  #search {
    width: 100%;
    height: 32px;
    padding: 0 12px 0 34px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
  }
  #search::placeholder { color: var(--muted); font-weight: 600; }
  #search:focus { outline: none; border-color: var(--accent); }
  .search:focus-within svg { color: var(--text); }
  @media (max-width: 720px) {
    .nav { flex-wrap: wrap; }
    .search { flex: 1 1 100%; width: 100%; order: -1; }
  }
  .chip {
    height: 32px;
    padding: 0 12px;
    font-size: 14px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    transition: color 0.12s ease, background 0.12s ease, border-color 0.12s ease;
  }
  .chip:hover { color: var(--text); }
  .chip.active { color: #1a0f17; background: var(--accent); border-color: var(--accent); }
  .hidden { display: none !important; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }
  .pets { display: grid; gap: 12px; }
  .pet {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  section.danger .section { color: var(--bad); }
  .pet.danger {
    border: 1px dashed color-mix(in srgb, var(--bad) 40%, var(--line));
    background: color-mix(in srgb, var(--bad) 7%, var(--card));
  }
  .emoji { font-size: 32px; width: 44px; text-align: center; flex-shrink: 0; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 16px; }
  .name a { color: inherit; text-decoration: none; }
  .name a:hover .label { text-decoration: underline; text-underline-offset: 3px; }
  .name .arrow { color: var(--muted); font-size: 12px; font-weight: 400; }
  .desc { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .tag {
    font-size: 12px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 100px;
    border: 1px solid currentColor;
    color: var(--muted);
    white-space: nowrap;
  }
  .tag.ok { color: var(--ok); }
  .tag.current { color: var(--accent); }
  button {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    height: 32px;
    border: 0;
    border-radius: 8px;
    padding: 0 14px;
    cursor: pointer;
    background: var(--accent);
    color: #1a0f17;
    transition: transform 0.1s ease, opacity 0.15s ease;
    flex-shrink: 0;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button.warn {
    background: transparent;
    color: var(--warn);
    border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
  }
  button.danger {
    background: transparent;
    color: var(--bad);
    border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent);
  }
  dialog {
    width: min(560px, calc(100vw - 32px));
    padding: 22px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
  }
  dialog[open] { animation: dialog-in 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); }
  dialog::backdrop { background: rgba(8, 6, 12, 0.7); backdrop-filter: blur(3px); }
  @keyframes dialog-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
  .dlg-head { display: flex; align-items: center; gap: 14px; }
  .dlg-head .emoji { font-size: 32px; width: 38px; }
  .dlg-title { font-weight: 600; font-size: 16px; }
  .status-text { color: var(--muted); font-size: 14px; }
  .status-text.bad { color: var(--bad); }
  .pct { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  .bar { height: 6px; background: var(--line); border-radius: 100px; overflow: hidden; margin-top: 16px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width 0.2s ease; }
  .bar.ok > div { background: var(--ok); }
  .bar.bad > div { background: var(--bad); }
  .terminal {
    margin: 14px 0 0;
    height: 240px;
    overflow: auto;
    background: #0b0a0f;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #c9c4d8;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .terminal .step { color: var(--accent); }
  .terminal .ok { color: var(--ok); }
  .terminal .bad { color: var(--bad); }
  .terminal.collapsed { display: none; }
  .done { text-align: center; padding: 18px 0 4px; }
  .done[hidden] { display: none; }
  .check {
    width: 56px;
    height: 56px;
    margin: 0 auto 14px;
    border-radius: 100px;
    background: color-mix(in srgb, var(--ok) 16%, transparent);
    color: var(--ok);
    display: grid;
    place-items: center;
    font-size: 32px;
    animation: pop 0.35s cubic-bezier(0.3, 1.5, 0.6, 1);
  }
  @keyframes pop { from { transform: scale(0.5); opacity: 0; } }
  .done-title { font-size: 16px; font-weight: 600; }
  .done-text { color: var(--muted); margin-top: 4px; font-size: 14px; }
  .dlg-actions { display: flex; gap: 10px; align-items: center; margin-top: 18px; }
  .dlg-actions[hidden] { display: none; }
  #closeBtn { margin-left: auto; }
  .link-btn { background: none; color: var(--muted); padding: 0; font-weight: 400; font-size: 12px; }
  .link-btn:hover { color: var(--text); }
  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    color: var(--muted);
    font-size: 13px;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--text); }
</style>
</head>

<main>

    </div>
  </div>

  <div id="catalog"></div>
  <p class="empty" id="empty" hidden>No installers match.</p>

  <footer>
    <a href="https://github.com/podrivo/cardputer" target="_blank" rel="noopener">GitHub ↗</a>
    <a href="https://docs.m5stack.com/en/core/Cardputer-Adv" target="_blank" rel="noopener">Docs ↗</a>
    <a href="https://shop.m5stack.com/products/m5stack-cardputer-adv-version-esp32-s3" target="_blank" rel="noopener">Shop ↗</a>
    <a href="https://burner.m5stack.com/" target="_blank" rel="noopener">M5Burner ↗</a>
  </footer>
</main>

<dialog id="dialog">
  <div id="progressView">
    <div class="dlg-head">
      <div class="emoji" id="dlgEmoji"></div>
      <div>
        <div class="dlg-title" id="dlgTitle"></div>
        <div class="status-text" id="statusText"></div>
      </div>
      <div class="pct" id="pct"></div>
    </div>
    <div class="bar" id="bar"><div id="barFill"></div></div>
  </div>
  <div class="done" id="doneView" hidden>
    <div class="check">✓</div>
    <div class="done-title" id="doneTitle"></div>
    <div class="done-text" id="doneText">Your Cardputer is restarting. Have fun!</div>
  </div>
  <pre class="terminal" id="log"></pre>
  <div class="dlg-actions" id="actions" hidden>
    <button class="link-btn" id="logsBtn">Show logs</button>
    <button class="ghost" id="copyBtn">Copy for AI</button>
    <button id="closeBtn">Done</button>
  </div>
</dialog>

<input type="file" id="filePicker" accept=".bin" hidden>

const DEVICE = [
  {
    id: "original",
    emoji: "📦",
    name: "Original firmware",
    repo: "https://github.com/m5stack/M5Cardputer-UserDemo",
    desc: "M5Stack's official User Demo v0.3 — the firmware the Cardputer came with",
    button: "Restore",
    buttonClass: "warn",
    parts: [{ file: bin("cardputer-adv-user-demo-v0.3.bin"), address: 0x0 }],
  },
  {
    id: "erase",
    emoji: "🧹",
    name: "Erase device",
    desc: "Wipe the entire flash. The Cardputer stays blank until you install something",
    button: "Erase",
    buttonClass: "danger",
    action: "erase",
  },
];

const $ = (id) => document.getElementById(id);
const buttons = [];
let busy = false;

if (!("serial" in navigator)) {
  showNotice("This browser can't talk to USB devices. Open this page in Chrome or Edge on a computer.");
}

function showNotice(html) {
  $("notice").innerHTML = html;
  $("notice").style.display = "block";
}

const BLOCKS = [
  { title: "Pets", items: PETS },
  { title: "Games", items: GAMES },
  { title: "Tools", items: TOOLS },
  ...MORE.map((g) => ({ title: g.title, items: g.items })),
  { title: "Device", items: DEVICE, danger: true },
];

let query = "";
let activeCat = "all";

function cardEl(item, current, danger) {
  const el = document.createElement("div");
  el.className = "pet" + (danger ? " danger" : "");
  const name = item.repo
    ? `<a href="${item.repo}" target="_blank" rel="noopener"><span class="label">${item.name}</span> <span class="arrow">↗</span></a>`
    : `<span class="label">${item.name}</span>`;
  el.innerHTML = `
    <div class="emoji">${item.emoji}</div>
    <div class="info">
      <div class="name">${name}</div>
      <div class="desc">${item.desc}</div>
    </div>
    <div class="actions">
      ${item.tag ? `<span class="tag ${item.tag[0]}">${item.tag[1]}</span>` : ""}
      ${current === item.id ? '<span class="tag current">Installed</span>' : ""}
    </div>`;
  el.dataset.search = `${item.name} ${item.desc} ${item.tag?.[1] || ""}`.toLowerCase();
  const btn = document.createElement("button");
  btn.textContent = item.button || "Install";
  if (item.buttonClass) btn.className = item.buttonClass;
  btn.onclick = () => (item.action === "erase" ? eraseDevice() : install(item));
  el.querySelector(".actions").appendChild(btn);
  buttons.push(btn);
  return el;
}

function renderChips() {
  const chips = $("chips");
  chips.innerHTML = "";
  const cats = ["all", ...BLOCKS.filter((b) => b.items).map((b) => b.title)];
  for (const cat of cats) {
    const block = BLOCKS.find((b) => b.title === cat);
    const c = document.createElement("button");
    c.className = "chip" + (cat === activeCat ? " active" : "");
    c.textContent = cat === "all" ? "All" : cat;
    c.onclick = () => { activeCat = cat; renderChips(); applyFilters(); };
    chips.appendChild(c);
  }
}

function applyFilters() {
  const q = query.trim().toLowerCase();
  const sections = [...$("catalog").children];
  let anyVisible = false;
  for (const section of sections) {
    const grid = section.querySelector(".pets");
    if (!grid) continue;
    const title = section.dataset.title;
    let shown = 0;
    for (const card of grid.children) {
      const vis = (activeCat === "all" || activeCat === title) && (!q || card.dataset.search.includes(q));
      card.classList.toggle("hidden", !vis);
      if (vis) shown++;
    }
    section.classList.toggle("hidden", shown === 0);
    if (shown) anyVisible = true;
  }
  $("empty").hidden = anyVisible;
}

function render() {
  const current = localStorage.getItem("installed");
  const catalog = $("catalog");
  catalog.innerHTML = "";
  buttons.length = 0;
  for (const block of BLOCKS) {
    const section = document.createElement("section");
    section.dataset.title = block.title;
    if (block.danger) section.className = "danger";
    const h = document.createElement("h2");
    h.className = "section";
    h.textContent = block.title;
    section.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "pets";
    for (const item of block.items) grid.appendChild(cardEl(item, current, block.danger));
    section.appendChild(grid);
    catalog.appendChild(section);
  }
  renderChips();
  applyFilters();
  setBusy(busy);
}

$("search").addEventListener("input", (e) => { query = e.target.value; applyFilters(); });

new IntersectionObserver(
  ([entry]) => $("nav").classList.toggle("stuck", !entry.isIntersecting),
  { threshold: 0 }
).observe($("navSentinel"));

function setBusy(value) {
  busy = value;
  for (const b of buttons) b.disabled = value || !("serial" in navigator);
}

function setStatus(text, kind = "") {
  $("statusText").textContent = text;
  $("statusText").className = "status-text " + kind;
}

function setProgress(fraction) {
  const pct = `${Math.round(fraction * 100)}%`;
  $("barFill").style.width = pct;
  $("pct").textContent = pct;
}

function write(text, kind = "") {
  const el = $("log");
  const stick = el.scrollHeight - el.scrollTop - el.clientHeight < 24;
  const span = document.createElement("span");
  if (kind) span.className = kind;
  span.textContent = text;
  el.appendChild(span);
  if (stick) el.scrollTop = el.scrollHeight;
}

const log = (line, kind) => write(line + "\n", kind);
const step = (line) => log(`› ${line}`, "step");
const hex = (n) => "0x" + n.toString(16).padStart(5, "0");

const terminal = {
  clean() {},
  writeLine: (s) => log(s),
  write: (s) => write(s),
};

function openDialog({ emoji, title, doneTitle, doneText }) {
  $("dlgEmoji").textContent = emoji || "↺";
  $("dlgTitle").textContent = title;
  $("doneTitle").textContent = doneTitle;
  $("doneText").textContent = doneText;
  $("log").textContent = "";
  $("log").classList.remove("collapsed");
  $("progressView").hidden = false;
  $("doneView").hidden = true;
  $("actions").hidden = true;
  $("bar").className = "bar";
  setProgress(0);
  $("dialog").showModal();
}

function finishDialog(ok) {
  $("bar").classList.add(ok ? "ok" : "bad");
  $("progressView").hidden = ok;
  $("doneView").hidden = !ok;
  $("log").classList.toggle("collapsed", ok);
  $("logsBtn").hidden = !ok;
  $("logsBtn").textContent = "Show logs";
  $("copyBtn").hidden = ok;
  $("copyBtn").textContent = "Copy for AI";
  $("closeBtn").textContent = ok ? "Done" : "Close";
  $("actions").hidden = false;
  $("closeBtn").focus();
}

$("logsBtn").onclick = () => {
  const collapsed = $("log").classList.toggle("collapsed");
  $("logsBtn").textContent = collapsed ? "Show logs" : "Hide logs";
};
$("closeBtn").onclick = () => $("dialog").close();

let failure = null;

function aiPrompt({ target, message }) {
  const files = target.parts.map((p) => `${p.file} at ${hex(p.address)}`).join(", ");
  return [
    "I'm flashing firmware onto an M5Stack Cardputer ADV (ESP32-S3, 8 MB flash, native USB-Serial/JTAG) " +
      "from a web page that uses esptool-js 0.7.0 over Web Serial, and the install failed. " +
      "Explain what went wrong and give me the steps to fix it.",
    "",
    `Firmware: ${target.name} (${files})`,
    `Browser: ${navigator.userAgent}`,
    `Error: ${message}`,
    "",
    "Full log:",
    "```",
    $("log").textContent.trim(),
    "```",
  ].join("\n");
}

$("copyBtn").onclick = async () => {
  const text = aiPrompt(failure);
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const area = Object.assign(document.createElement("textarea"), { value: text });
    $("dialog").appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  $("copyBtn").textContent = "Copied ✓";
  setTimeout(() => { $("copyBtn").textContent = "Copy for AI"; }, 2000);
};
$("dialog").addEventListener("cancel", (e) => { if (busy) e.preventDefault(); });

// file:// pages can't fetch neighbouring files, so fall back to asking for the file.
function pickFile(name) {
  return new Promise((resolve, reject) => {
    const picker = $("filePicker");
    picker.value = "";
    picker.onchange = async () => {
      const f = picker.files[0];
      if (!f) return reject(new Error("No file chosen"));
      resolve(new Uint8Array(await f.arrayBuffer()));
    };
    picker.oncancel = () => reject(new Error(`Cancelled. Please choose ${name}`));
    setStatus(`Choose ${name} from the bins folder`);
    picker.click();
  });
}

const fileCache = new Map();
async function loadFile(name) {
  if (fileCache.has(name)) return fileCache.get(name);
  let data;
  try {
    const res = await fetch(name);
    if (!res.ok) throw new Error(res.statusText);
    data = new Uint8Array(await res.arrayBuffer());
  } catch {
    data = await pickFile(name);
  }
  fileCache.set(name, data);
  return data;
}

async function install(target) {
  if (busy) return;
  if (target.id === "original" && !confirm("Replace the current firmware with the original User Demo?")) return;

  setBusy(true);
  openDialog({
    emoji: target.emoji,
    title: `Installing ${target.name}`,
    doneTitle: `${target.name} is installed`,
    doneText: "Your Cardputer is restarting. Have fun!",
  });
  let transport;

  try {
    setStatus("Pick the Cardputer in the popup…");
    step("Waiting for a USB device");
    const port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x303a }] });
    const { usbVendorId, usbProductId } = port.getInfo();
    log(`Selected USB device ${usbVendorId?.toString(16)}:${usbProductId?.toString(16)}`);

    setStatus("Loading firmware…");
    step("Loading firmware files");
    const fileArray = [];
    for (const part of target.parts) {
      const data = await loadFile(part.file);
      fileArray.push({ data, address: part.address });
      log(`${part.file}: ${data.length.toLocaleString()} bytes at ${hex(part.address)}`);
    }
    const total = fileArray.reduce((n, f) => n + f.data.length, 0);
    const before = fileArray.map((_, i) => fileArray.slice(0, i).reduce((n, f) => n + f.data.length, 0));

    setStatus("Connecting…");
    step("Connecting to the Cardputer");
    transport = new Transport(port, false);
    const loader = new ESPLoader({ transport, baudrate: 921600, terminal, debugLogging: false });
    const chip = await loader.main();
    log(`Connected to ${chip}`, "ok");

    setStatus(`Writing ${(total / 1024 / 1024).toFixed(1)} MB to flash…`);
    step("Writing firmware");
    await loader.writeFlash({
      fileArray,
      flashMode: "keep",
      flashFreq: "keep",
      flashSize: "keep",
      eraseAll: false,
      compress: true,
      reportProgress: (i, written, size) => {
        const done = before[i] + (written / size) * fileArray[i].data.length;
        setProgress(done / total);
      },
    });

    setStatus("Restarting the Cardputer…");
    step("Restarting");
    await loader.after("hard_reset");
    setProgress(1);
    log(`Done. ${target.name} is installed.`, "ok");
    localStorage.setItem("installed", target.id);
    finishDialog(true);
  } catch (err) {
    if (!$("log").textContent.endsWith("\n")) write("\n");
    log(String(err?.stack || err), "bad");
    $("dlgTitle").textContent = `Couldn't install ${target.name}`;
    let msg = err?.name === "NotFoundError" ? "No device picked." : String(err?.message || err);
    if (/busy|open/i.test(msg)) {
      msg = "The USB port is busy. Close other tabs or apps using the Cardputer (like M5Burner or a terminal running esptool) and try again.";
    }
    setStatus(`Install failed: ${msg}`, "bad");
    failure = { target, message: `${err?.name || "Error"}: ${err?.message || err}` };
    finishDialog(false);
  } finally {
    try { await transport?.disconnect(); } catch {}
    setBusy(false);
    render();
  }
}

async function eraseDevice() {
  if (busy) return;
  if (!confirm("Erase the entire Cardputer flash? Everything on the device will be wiped and it won't boot until you install firmware.")) return;

  setBusy(true);
  openDialog({
    emoji: "🧹",
    title: "Erasing the Cardputer",
    doneTitle: "Flash erased",
    doneText: "The Cardputer is blank. Install firmware when you're ready.",
  });
  let transport;

  try {
    setStatus("Pick the Cardputer in the popup…");
    step("Waiting for a USB device");
    const port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x303a }] });
    const { usbVendorId, usbProductId } = port.getInfo();
    log(`Selected USB device ${usbVendorId?.toString(16)}:${usbProductId?.toString(16)}`);

    setStatus("Connecting…");
    step("Connecting to the Cardputer");
    transport = new Transport(port, false);
    const loader = new ESPLoader({ transport, baudrate: 921600, terminal, debugLogging: false });
    const chip = await loader.main();
    log(`Connected to ${chip}`, "ok");

    setStatus("Erasing flash (this can take a minute)…");
    step("Erasing flash");
    await loader.eraseFlash();
    setProgress(1);
    log("Chip erase completed.", "ok");

    setStatus("Restarting the Cardputer…");
    step("Restarting");
    await loader.after("hard_reset");
    localStorage.removeItem("installed");
    finishDialog(true);
  } catch (err) {
    if (!$("log").textContent.endsWith("\n")) write("\n");
    log(String(err?.stack || err), "bad");
    $("dlgTitle").textContent = "Couldn't erase the Cardputer";
    let msg = err?.name === "NotFoundError" ? "No device picked." : String(err?.message || err);
    if (/busy|open/i.test(msg)) {
      msg = "The USB port is busy. Close other tabs or apps using the Cardputer (like M5Burner or a terminal running esptool) and try again.";
    }
    setStatus(`Erase failed: ${msg}`, "bad");
    failure = { target: { name: "Erase device", parts: [] }, message: `${err?.name || "Error"}: ${err?.message || err}` };
    finishDialog(false);
  } finally {
    try { await transport?.disconnect(); } catch {}
    setBusy(false);
    render();
  }
}

render();
</script>
