name: Sync installers

# Weekly check of GitHub Releases for catalog firmwares.
# When newer bins are found: update bins + catalog refs, open a PR, and merge it.

on:
  schedule:
    - cron: "17 7 * * 1" # Mondays 07:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only (no branch / PR)"
        type: boolean
        default: false

concurrency:
  group: sync-installers
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync installer bins
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/sync-installers.mjs --dry-run
          else
            node scripts/sync-installers.mjs
          fi

      - name: Open and merge PR
        if: >-
          steps.sync.outputs.updated != '0' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/sync-installers"
          git checkout -B "$BRANCH"

          git add -A bins scripts/installer-sync-lock.json index.html catalog-extra.js
          if git diff --cached --quiet; then
            echo "Nothing staged after sync"
            exit 0
          fi

          COUNT="${{ steps.sync.outputs.updated }}"
          git commit -m "$(cat <<EOF
          chore: sync ${COUNT} installer(s) from upstream releases

          ${SUMMARY}
          EOF
          )"

          git push --force --set-upstream origin "$BRANCH"

          TITLE="chore: sync ${COUNT} installer(s) from upstream"
          BODY="$(cat <<EOF
          ## Summary
          Automated weekly sync of Cardputer ADV catalog firmwares from upstream GitHub Releases.

          ${SUMMARY}

          ## Test plan
          - [ ] Spot-check updated installer cards on the site
          - [ ] Confirm bin filenames match catalog entries
          EOF
          )"

          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
            PR="$EXISTING"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
            PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          fi

          echo "Merging PR #$PR"
          if ! gh pr merge "$PR" --squash --delete-branch; then
            echo "Immediate merge blocked; enabling auto-merge"
            gh pr merge "$PR" --auto --squash --delete-branch
          fi

      - name: No updates
        if: steps.sync.outputs.updated == '0'
        run: echo "All tracked installers are up to date."
