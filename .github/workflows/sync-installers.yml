name: Sync installers

# Weekly check of GitHub Releases for catalog firmwares.
# When newer bins are found: update bins + catalog refs and push to main.

on:
  schedule:
    - cron: "17 7 * * 1" # Mondays 07:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only (no commit / push)"
        type: boolean
        default: false

concurrency:
  group: sync-installers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync installer bins
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/sync-installers.mjs --dry-run
          else
            node scripts/sync-installers.mjs
          fi

      - name: Commit and push
        if: >-
          steps.sync.outputs.updated != '0' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A bins scripts/installer-sync-lock.json index.html catalog-extra.js
          if git diff --cached --quiet; then
            echo "Nothing staged after sync"
            exit 0
          fi

          COUNT="${{ steps.sync.outputs.updated }}"
          git commit -m "$(cat <<EOF
          chore: sync ${COUNT} installer(s) from upstream releases

          ${SUMMARY}
          EOF
          )"

          git push

      - name: No updates
        if: steps.sync.outputs.updated == '0'
        run: echo "All tracked installers are up to date."
